spring.application.name=ms-pedidos360-orders
server.port=8081

# ---- Oracle (levantado por docker-compose, servicio "oracle-db") ----
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER:pedidos360}
spring.datasource.password=${DB_PASSWORD:pedidos360}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- Seguridad: Resource Server (JWT emitido por Azure AD / Entra ID, vía BFF) ----
# Reemplazar <TENANT_ID> por el tenant real que configura Daniel en Azure AD.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/v2.0
pedidos360.security.audience=${API_AUDIENCE:api://ms-pedidos360-orders}

# ---- RabbitMQ ----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ---- Actuator (health check) ----
management.endpoints.web.exposure.include=health,info
