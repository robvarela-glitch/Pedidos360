spring.application.name=ms-pedidos360-orders
server.port=8081

# ---- Oracle ----
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER:pedidos360}
spring.datasource.password=${DB_PASSWORD:pedidos360}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---- Catálogo (precio oficial de los productos) ----
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# ---- Seguridad: Resource Server (JWT emitido por Microsoft Entra ID) ----
# Todos los servicios validan el MISMO audience: la API expuesta por la App Registration
# de Pedidos360 (scope access_as_user). Se aceptan tokens v1 (iss sts.windows.net,
# aud api://<client-id>) y v2 (iss login.microsoftonline.com/.../v2.0, aud <client-id>).
pedidos360.security.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/discovery/v2.0/keys
pedidos360.security.issuers=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/v2.0,https://sts.windows.net/${AZURE_TENANT_ID:<TENANT_ID>}/
pedidos360.security.audiences=api://${API_CLIENT_ID:bd954135-48c5-4201-ac11-37071ec979ab},${API_CLIENT_ID:bd954135-48c5-4201-ac11-37071ec979ab}
pedidos360.security.required-scope=${API_REQUIRED_SCOPE:access_as_user}
pedidos360.security.default-role=${DEFAULT_ROLE:Cliente}

# ---- RabbitMQ: conexión al clúster (2 nodos) ----
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ---- RabbitMQ: topología centralizada (mismos nombres en todos los microservicios) ----
pedidos360.rabbit.exchanges.direct=pedidos360.orders.direct
pedidos360.rabbit.exchanges.topic=pedidos360.events.topic
pedidos360.rabbit.exchanges.dead-letter=pedidos360.dlx
pedidos360.rabbit.queues.notify=pedidos360.notify.orders
pedidos360.rabbit.queues.report=pedidos360.report.orders
pedidos360.rabbit.queues.audit=pedidos360.audit.events
pedidos360.rabbit.routing-keys.notify=notify.order
pedidos360.rabbit.routing-keys.order-prefix=order
pedidos360.rabbit.routing-keys.product-prefix=product
pedidos360.rabbit.bindings.report=order.*
pedidos360.rabbit.bindings.audit=#
pedidos360.rabbit.retry.max-attempts=3
pedidos360.rabbit.retry.backoff-ms=1000
pedidos360.rabbit.retry.allow-failure-simulation=${RABBIT_ALLOW_FAILURE_SIMULATION:true}
# Publisher confirms/returns: se registra en el log si un mensaje no llega al broker o no tiene cola
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ---- Kafka (OPCIONAL, desactivado por defecto) ----
pedidos360.kafka.enabled=${KAFKA_ENABLED:false}
pedidos360.kafka.topic=orders.events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ---- Actuator (health check) ----
management.endpoints.web.exposure.include=health,info,prometheus
# Observabilidad: Prometheus lee /actuator/prometheus (solo desde la red interna de Docker).
# La etiqueta "application" permite filtrar cada microservicio en Grafana.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
