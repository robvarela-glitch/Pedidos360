# =========================================================================
# Pedidos360 - Infraestructura y microservicios (parte de Agustín)
# Levanta: Oracle, RabbitMQ, Kafka + Zookeeper, y los 5 microservicios
# ms-pedidos360-orders / catalog / notify / report / audit
# =========================================================================

services:

  # ---------------------------------------------------------------------
  # BASE DE DATOS
  # ---------------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: pedidos360-oracle
    environment:
      ORACLE_PASSWORD: pedidos360
      APP_USER: pedidos360
      APP_USER_PASSWORD: pedidos360
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------
  # MENSAJERÍA
  # ---------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------
  # ZOOKEEPER
  # ---------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pedidos360-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------------------------------------------------------------------
  # KAFKA
  # ---------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pedidos360-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Puerto 29092 para los contenedores
      # y 9092 para herramientas locales.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ---------------------------------------------------------------------
  # MICROSERVICIO ORDERS
  # ---------------------------------------------------------------------
  ms-orders:
    build: ../ms-pedidos360-orders
    container_name: pedidos360-ms-orders
    depends_on:
      oracle-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: pedidos360
      DB_PASSWORD: pedidos360
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP: kafka:29092
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      API_AUDIENCE: api://ms-pedidos360-orders

  # ---------------------------------------------------------------------
  # MICROSERVICIO CATALOG
  # ---------------------------------------------------------------------
  ms-catalog:
    build: ../ms-pedidos360-catalog
    container_name: pedidos360-ms-catalog
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: pedidos360
      DB_PASSWORD: pedidos360
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      API_AUDIENCE: api://ms-pedidos360-catalog

  # ---------------------------------------------------------------------
  # MICROSERVICIO NOTIFY
  # ---------------------------------------------------------------------
  ms-notify:
    build: ../ms-pedidos360-notify
    container_name: pedidos360-ms-notify
    depends_on:
      oracle-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: pedidos360
      DB_PASSWORD: pedidos360
      RABBITMQ_HOST: rabbitmq
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      API_AUDIENCE: api://ms-pedidos360-notify

  # ---------------------------------------------------------------------
  # MICROSERVICIO REPORT
  # ---------------------------------------------------------------------
  ms-report:
    build: ../ms-pedidos360-report
    container_name: pedidos360-ms-report
    depends_on:
      oracle-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: pedidos360
      DB_PASSWORD: pedidos360
      KAFKA_BOOTSTRAP: kafka:29092
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      API_AUDIENCE: api://ms-pedidos360-report

  # ---------------------------------------------------------------------
  # MICROSERVICIO AUDIT
  # ---------------------------------------------------------------------
  ms-audit:
    build: ../ms-pedidos360-audit
    container_name: pedidos360-ms-audit
    depends_on:
      oracle-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      DB_USER: pedidos360
      DB_PASSWORD: pedidos360
      KAFKA_BOOTSTRAP: kafka:29092
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      API_AUDIENCE: api://ms-pedidos360-audit

  # ---------------------------------------------------------------------
  # BFF
  # Único punto de entrada para el frontend Angular
  # ---------------------------------------------------------------------
  ms-bff:
    build: ../ms-pedidos360-bff
    container_name: pedidos360-ms-bff
    depends_on:
      - ms-orders
      - ms-catalog
      - ms-notify
      - ms-report
      - ms-audit
    ports:
      - "8080:8080"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      API_AUDIENCE: api://ms-pedidos360-bff
      ORDERS_SERVICE_URL: http://ms-orders:8081
      CATALOG_SERVICE_URL: http://ms-catalog:8082
      NOTIFY_SERVICE_URL: http://ms-notify:8083
      REPORT_SERVICE_URL: http://ms-report:8084
      AUDIT_SERVICE_URL: http://ms-audit:8085

# -------------------------------------------------------------------------
# VOLUMENES
# -------------------------------------------------------------------------
volumes:
  oracle_data: