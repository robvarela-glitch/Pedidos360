spring.application.name=ms-pedidos360-bff
server.port=8080

# ---- Seguridad: Resource Server (JWT emitido por Azure AD / Entra ID) ----
# Mismo tenant que el resto de los microservicios (AZURE_TENANT_ID, lo da Daniel).
# La audience de ESTE servicio identifica a la App Registration del BFF.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/v2.0
pedidos360.security.audience=${API_AUDIENCE:api://ms-pedidos360-bff}

# ---- Microservicios internos hacia los que el BFF reenvía las peticiones ----
# En docker-compose usar los nombres de servicio (ms-orders, ms-catalog, etc.);
# en local, cada uno cae por defecto al puerto que Agustín definió.
services.orders.url=${ORDERS_SERVICE_URL:http://localhost:8081}
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}
services.notify.url=${NOTIFY_SERVICE_URL:http://localhost:8083}
services.report.url=${REPORT_SERVICE_URL:http://localhost:8084}
services.audit.url=${AUDIT_SERVICE_URL:http://localhost:8085}

# ---- Actuator (health check) ----
management.endpoints.web.exposure.include=health,info
