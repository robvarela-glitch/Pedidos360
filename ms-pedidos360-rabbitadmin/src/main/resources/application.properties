spring.application.name=ms-pedidos360-rabbitadmin
server.port=8086

# ---- Seguridad: Resource Server (JWT emitido por Microsoft Entra ID) ----
# Todos los servicios validan el MISMO audience: la API expuesta por la App Registration
# de Pedidos360 (scope access_as_user). Se aceptan tokens v1 (iss sts.windows.net,
# aud api://<client-id>) y v2 (iss login.microsoftonline.com/.../v2.0, aud <client-id>).
pedidos360.security.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/discovery/v2.0/keys
pedidos360.security.issuers=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/v2.0,https://sts.windows.net/${AZURE_TENANT_ID:<TENANT_ID>}/
pedidos360.security.audiences=api://${API_CLIENT_ID:bd954135-48c5-4201-ac11-37071ec979ab},${API_CLIENT_ID:bd954135-48c5-4201-ac11-37071ec979ab}
pedidos360.security.required-scope=${API_REQUIRED_SCOPE:access_as_user}
pedidos360.security.default-role=${DEFAULT_ROLE:Cliente}

# ---- RabbitMQ: conexión al clúster (AMQP, para crear/eliminar recursos) ----
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ---- Administrador ----
pedidos360.rabbitadmin.dead-letter-exchange=pedidos360.dlx
# API HTTP de RabbitMQ (plugin management) para listar colas/exchanges/bindings/nodos
pedidos360.rabbitadmin.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
pedidos360.rabbitadmin.management.username=${RABBITMQ_USER:guest}
pedidos360.rabbitadmin.management.password=${RABBITMQ_PASSWORD:guest}
# Topología base de Pedidos360: no se puede eliminar desde la API
pedidos360.rabbitadmin.protected-names=pedidos360.orders.direct,pedidos360.events.topic,pedidos360.dlx,\
  pedidos360.notify.orders,pedidos360.notify.orders.dlq,\
  pedidos360.report.orders,pedidos360.report.orders.dlq,\
  pedidos360.audit.events,pedidos360.audit.events.dlq

management.endpoints.web.exposure.include=health,info,prometheus
# Observabilidad: Prometheus lee /actuator/prometheus (solo desde la red interna de Docker).
# La etiqueta "application" permite filtrar cada microservicio en Grafana.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
