spring.application.name=ms-pedidos360-catalog
server.port=8082

# ---- Oracle ----
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${DB_USER:pedidos360}
spring.datasource.password=${DB_PASSWORD:pedidos360}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- Seguridad: Resource Server ----
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID:<TENANT_ID>}/v2.0
pedidos360.security.audience=${API_AUDIENCE:api://ms-pedidos360-catalog}

management.endpoints.web.exposure.include=health,info
