<div class="orders-container">

  <div class="page-header">
    <div>
      <h2>Pedidos</h2>
      <p>Gestiona y controla los pedidos de tu empresa</p>
    </div>

    <button class="new-order-button">
      + Nuevo pedido
    </button>
  </div>

  <div class="filters">

    <input
      type="text"
      placeholder="🔍 Buscar pedido o cliente..."
    >

    <select>
      <option>Todos los estados</option>
      <option>Creado</option>
      <option>Aceptado</option>
      <option>En preparación</option>
      <option>Despachado</option>
      <option>Entregado</option>
      <option>Cancelado</option>
    </select>

  </div>

  <div class="orders-card">

    <div class="table-header">
      <span>ID Pedido</span>
      <span>Cliente</span>
      <span>Fecha</span>
      <span>Estado</span>
      <span>Total</span>
      <span>Acciones</span>
    </div>

    @for (order of orders; track order.id) {

      <div class="order-row">

        <strong>#PED-{{ order.id.toString().padStart(3, '0') }}</strong>

        <span>{{ order.customer }}</span>

        <span>{{ order.date }}</span>

        <span
          class="status"
          [class.accepted]="order.status === 'ACEPTADO'"
          [class.preparation]="order.status === 'EN_PREPARACIÓN'"
          [class.dispatched]="order.status === 'DESPACHADO'"
          [class.delivered]="order.status === 'ENTREGADO'"
          [class.cancelled]="order.status === 'CANCELADO'"
        >
          {{ order.status }}
        </span>

        <strong>
          ${{ order.total.toLocaleString('es-CL') }}
        </strong>

        <button class="view-button">
          Ver
        </button>

      </div>

    }

  </div>

</div>
