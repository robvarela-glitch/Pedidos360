<style>
  :host {
    /* Paleta OKLCH */
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);

    --bg-base: oklch(98% 0.005 300);
    --surface-glass: oklch(100% 0 0 / 0.72);
    --border-glass: oklch(100% 0 0 / 0.85);
    
    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --primary-gradient: linear-gradient(
      135deg,
      var(--bright-blue) 0%,
      var(--electric-violet) 50%,
      var(--vivid-pink) 100%
    );

    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(at 0% 0%, color-mix(in srgb, var(--bright-blue) 12%, transparent) 0px, transparent 50%),
      radial-gradient(at 100% 100%, color-mix(in srgb, var(--vivid-pink) 10%, transparent) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--gray-900);
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  /* Header Flotante */
  header {
    position: sticky;
    top: 1rem;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(92%, 1100px);
    margin: 1rem auto 0;
    padding: 0.75rem 1.5rem;
    background: var(--surface-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-glass);
    border-radius: 9999px;
    box-shadow: 0 4px 20px oklch(0% 0 0 / 0.05);
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  nav a {
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--gray-700);
    padding: 0.4rem 0.9rem;
    border-radius: 9999px;
    transition: color 0.2s ease, background-color 0.2s ease;
  }

  nav a:hover {
    color: var(--gray-900);
    background-color: oklch(0% 0 0 / 0.04);
  }

  /* Botones de Autenticación */
  .auth-btn {
    border: none;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0.5rem 1.1rem;
    border-radius: 9999px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .auth-btn:hover {
    transform: translateY(-1px);
  }

  .auth-btn:active {
    transform: scale(0.98);
  }

  .auth-btn.primary {
    background: var(--primary-gradient);
    color: white;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--electric-violet) 40%, transparent);
  }

  .auth-btn.outline {
    background: transparent;
    color: var(--gray-700);
    border: 1px solid color-mix(in srgb, var(--gray-400) 40%, transparent);
  }

  .auth-btn.outline:hover {
    background: oklch(0% 0 0 / 0.03);
    color: var(--gray-900);
  }

  /* Contenedor Principal */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: min(92%, 1100px);
    margin: 0 auto;
    padding: 3rem 1rem;
  }

  /* Hero / Banner de Bienvenida */
  .welcome-card {
    text-align: center;
    background: var(--surface-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 1.5rem;
    padding: 3.5rem 2.5rem;
    max-width: 620px;
    box-shadow: 0 10px 30px oklch(0% 0 0 / 0.04);
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .welcome-card h2 {
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0 0 1.5rem 0;
    line-height: 1.25;
    color: var(--gray-900);
  }

  .welcome-card .credits {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--gray-700);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.5rem 1rem;
    border-radius: 9999px;
    background-color: oklch(0% 0 0 / 0.03);
    border: 1px solid oklch(0% 0 0 / 0.05);
  }

  .welcome-card .credits strong {
    color: var(--electric-violet);
    font-weight: 600;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Responsive */
  @media (max-width: 640px) {
    header {
      padding: 0.75rem 1rem;
      border-radius: 1.25rem;
    }

    h1 {
      font-size: 0.95rem;
    }

    .welcome-card {
      padding: 2.5rem 1.5rem;
    }

    .welcome-card h2 {
      font-size: 1.6rem;
    }

    .welcome-card .credits {
      font-size: 0.85rem;
      flex-direction: column;
      gap: 0.2rem;
    }
  }
</style>

<header>
  <h1>Mi Aplicación Angular con MINSAL</h1>

  <nav>
    <a routerLink="/">Inicio</a>
    <a routerLink="/profile">Mi Perfil</a>
  </nav>

  <div>
    @if (!isLoggedIn) {
      <button class="auth-btn primary" (click)="login()">Iniciar Sesión</button>
    } @else {
      <button class="auth-btn outline" (click)="logout()">Cerrar Sesión</button>
    }
  </div>
</header>

<main>
    <section class="welcome-card">
      <h2>Bienvenido a nuestra proyecto de Pedidos360</h2>
      <p class="credits">
        Desarrollado para el curso de: <strong>Desarrollo Cloud Native I</strong>
      </p>
    </section>
  <router-outlet></router-outlet>
</main>
